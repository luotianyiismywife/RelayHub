# OpenCode Zen 上游插件定义
# kind: Upstream-text-api-free（文本 + API Key 匿名 + 免费模型，无余额/套餐计费）
# 平台：OpenCode Zen https://opencode.ai/zen/v1/
# 规则来源：opencode 官方源码（packages/opencode/src/session/llm/request.ts）+
#          zen 后端（packages/console/app/src/routes/zen/util/handler.ts）+ 抓包实测
apiVersion: relayhub.io/v1
kind: Upstream-text-api-free
metadata:
  name: opencode-zen
  version: 1.0.0
  labels:
    vendor: opencode

# 依赖声明（Cargo 规则，见插件开发规范 §1.5）
depends:
  kernel: "^0.1"

# ── 入口地址（免费模型端点；Go 套餐是 /zen/go/v1/）─────────
# 平台换域名/自建反代/内网镜像时只改 config.yaml，不动插件
base_url: "{{ref:opencode_zen_base_url}}"

# ── 端点（key = 协议名，内核按协议分发）────────────────────
# 免费模型走 openai 协议；muse-spark（Meta）走 responses 协议
apis:
  openai:                       # hy3-free / mimo-v2.5-free / x-preview-f-free 等
    path: /v1/chat/completions
    method: POST
  responses:                    # muse-spark-1.2-contributor-free（禁 HK/SG 节点）
    path: /v1/responses
    method: POST
  models:                       # 模型列表（zen 返回标准 OpenAI 格式）
    path: /v1/models
    method: GET

# ── 认证：匿名固定值 ───────────────────────────────────────
# zen 免费模型接受 key="public"（匿名），无需账号/凭据管理、无需 docker secret
auth:
  type: static
  value: "public"

# ── 请求头注入：伪装 opencode CLI（抓包实测，原因见 README）──
# ★ 真实 opencode CLI 请求头（2026-08-24 抓包）：
#   {
#     "User-Agent": "opencode/1.15.0 ai-sdk/provider-utils/4.0.23 runtime/bun/1.3.13",
#     "x-opencode-client": "cli",
#     "x-opencode-project": "global",
#     "x-opencode-request": "msg_po1nt9",
#     "x-opencode-session": "ses_po1nt9"
#   }
# 对应关系：
#   User-Agent              → {{ref:opencode_user_agent}}（版本漂移 → config.yaml 可改）
#   x-opencode-client       → "cli"（静态）
#   x-opencode-project      → "global"（CLI 未指定项目时的兜底值，静态）
#   x-opencode-session/request → 动态模板：ses_/msg_ 前缀 + 同请求共享随机串
#                                （真实 CLI 两者同源，{{var:rid}} 表达这种关联）
headers:
  User-Agent: "{{ref:opencode_user_agent}}"
  x-opencode-client: "cli"
  x-opencode-project: "global"
  x-opencode-session: "ses_{{var:rid}}"
  x-opencode-request: "msg_{{var:rid}}"

# ── 请求体默认参数 ────────────────────────────────────────
# 免费模型建议显式声明 max_tokens（Anthropic 系必传；OpenAI 系可选）
body:
  defaults:
    max_tokens: 4096

# ── 出口网络：代理池（绕 IP 限速 + 地区限制）───────────────
# zen 免费模型按 IP 维度限速（源码 allowAnonymous + createIpRateLimiter）；
# muse-spark 禁香港/新加坡节点（源码 isModelCountryRestricted）。
# 代理池来源/轮换策略在 config.yaml 配（resin 订阅转的节点列表）。
network:
  proxy_pool: ref:opencode-zen-pool

# ── 错误判定（匿名场景：rotate 语义 = 换出口 IP）────────────
# http.yaml = 完整状态码 → 动作映射（429 cooldown 换 IP、403 地区限制换 IP）
rotation:
  http_rules: ./http.yaml
  error_patterns:               # zen 错误体文本模式（不区分大小写）
    - "rate_limit"              # 限速（超速 → 换出口 IP）
    - "country_not_allowed"     # 地区限制（禁 HK/SG → 换美国等出口）
    - "RegionError"             # zen 源码 RegionError 类型名
  balance_ttl: 0                # 免费模型无余额，不查询

# ── 脚本清单 ──────────────────────────────────────────────
# convert_request  → 已由顶层 headers 声明化取代（设计文档 §5.6），省略
# convert_response → 透传（标准 OpenAI 响应，内核入口已归一化），省略
# quota_balance / quota_usage → 无（免费模型无余额/套餐，IP 维度配额归内核），省略
scripts:
  list_models: ./models.ts
